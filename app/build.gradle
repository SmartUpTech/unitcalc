import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "net.smartlogic.unitconverter"
        minSdk 26
        targetSdk {
            version = release(36)
        }
        versionCode 11
        versionName "1.9"
    }

    namespace "net.smartlogic.unitconverter"

    buildFeatures {
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
        release {
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes.addAll([
                'META-INF/DEPENDENCIES',
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/license.txt',
                'META-INF/notice.txt',
                'META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version',
                'META-INF/androidx.swiperefreshlayout_swiperefreshlayout.version',
                'META-INF/androidx.print_print.version',
                'META-INF/androidx.customview_customview.version',
                'META-INF/androidx.cursoradapter_cursoradapter.version',
                'META-INF/androidx.drawerlayout_drawerlayout.version',
                'META-INF/androidx.versionedparcelable_versionedparcelable.version',
                'META-INF/androidx.interpolator_interpolator.version',
                'META-INF/androidx.fragment_fragment.version',
                'META-INF/androidx.vectordrawable_vectordrawable.version',
                'META-INF/androidx.core_core.version',
                'META-INF/androidx.legacy_legacy-support-core-ui.version',
                'META-INF/androidx.legacy_legacy-support-core-utils.version',
                'META-INF/proguard/androidx-annotations.pro',
                'META-INF/androidx.slidingpanelayout_slidingpanelayout.version',
                'META-INF/androidx.documentfile_documentfile.version',
                'META-INF/androidx.asynclayoutinflater_asynclayoutinflater.version',
                'META-INF/androidx.appcompat_appcompat.version',
                'META-INF/androidx.loader_loader.version',
                'META-INF/androidx.viewpager_viewpager.version',
                'META-INF/androidx.coordinatorlayout_coordinatorlayout.version'
            ])
        }
    }

}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'

    // GMA Next-Gen AdMob SDK
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.4.0'

    // For App Open Ads lifecycle support
    implementation "androidx.lifecycle:lifecycle-runtime:2.11.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.11.0"
    implementation "androidx.lifecycle:lifecycle-process:2.11.0"
}
