apply plugin: 'com.android.application'

android {

    compileSdk 36
    defaultConfig {
        applicationId "net.smartlogic.unitconverter"
        minSdkVersion 26
        targetSdk 36
        versionCode 9
        versionName "1.8"
    }

    namespace "net.smartlogic.unitconverter"

    android {
        buildFeatures {
            buildConfig = true
        }
    }

    buildTypes {
        debug {
            shrinkResources false
            minifyEnabled false
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/license.txt', 'META-INF/notice.txt', 'META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version', 'META-INF/androidx.swiperefreshlayout_swiperefreshlayout.version', 'META-INF/androidx.print_print.version', 'META-INF/androidx.customview_customview.version', 'META-INF/androidx.cursoradapter_cursoradapter.version', 'META-INF/androidx.drawerlayout_drawerlayout.version', 'META-INF/androidx.versionedparcelable_versionedparcelable.version', 'META-INF/androidx.interpolator_interpolator.version', 'META-INF/androidx.fragment_fragment.version', 'META-INF/androidx.vectordrawable_vectordrawable.version', 'META-INF/androidx.core_core.version', 'META-INF/androidx.legacy_legacy-support-core-ui.version', 'META-INF/androidx.legacy_legacy-support-core-utils.version', 'META-INF/proguard/androidx-annotations.pro', 'META-INF/androidx.slidingpanelayout_slidingpanelayout.version', 'META-INF/androidx.print_print.version', 'META-INF/androidx.documentfile_documentfile.version', 'META-INF/androidx.versionedparcelable_versionedparcelable.version', 'META-INF/androidx.asynclayoutinflater_asynclayoutinflater.version', 'META-INF/androidx.drawerlayout_drawerlayout.version', 'META-INF/androidx.interpolator_interpolator.version', 'META-INF/androidx.appcompat_appcompat.version', 'META-INF/androidx.swiperefreshlayout_swiperefreshlayout.version', 'META-INF/androidx.loader_loader.version', 'META-INF/androidx.viewpager_viewpager.version', 'META-INF/androidx.coordinatorlayout_coordinatorlayout.version', 'META-INF/androidx.cursoradapter_cursoradapter.version']
        }
    }

}

dependencies {
    //testImplementation 'junit:junit:4.12'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'

    // AdMob Dependency
    implementation 'com.google.android.gms:play-services-ads:25.2.0'

    //For App Open Ads
    implementation "androidx.lifecycle:lifecycle-runtime:2.10.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.10.0"
    implementation "androidx.lifecycle:lifecycle-process:2.10.0"
}
